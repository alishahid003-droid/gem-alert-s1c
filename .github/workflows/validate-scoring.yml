name: Validate scoring (Section 1 -- point-in-time + categorized backtests)

on:
  workflow_dispatch: {}
  # One-shot cron from Sept 29 2026 REMOVED here (Sept 29 2026, same night)
  # -- it did its job (run #3, 03:02 UTC, real budget-fresh read). Back to
  # workflow_dispatch-only so this doesn't silently recur and burn MadeOnSol
  # budget every day.

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Point-in-time credibility backtest
        env:
          MADEONSOL_API_KEY: ${{ secrets.MADEONSOL_API_KEY }}
          BIRDEYE_API_KEY: ${{ secrets.BIRDEYE_API_KEY }}
          PYTHONUNBUFFERED: "1"
        # PYTHONUNBUFFERED + python -u: without this, Python block-buffers
        # stdout when it isn't a real terminal (exactly the case here, piped
        # into GitHub's log capture) -- prints can sit invisible for many
        # minutes even while the script is actively working. `timeout` is a
        # hard ceiling so a slow/rate-limited API call fails loudly instead
        # of silently eating the whole job.
        run: timeout 900 python -u backtest_point_in_time.py --skip-onchain
      - name: Categorized credibility / sniper-accuracy backtest
        env:
          MADEONSOL_API_KEY: ${{ secrets.MADEONSOL_API_KEY }}
          MOBULA_API_KEY: ${{ secrets.MOBULA_API_KEY }}
          PYTHONUNBUFFERED: "1"
        # Real gap found and fixed Sept 29 2026: this step never passed
        # MOBULA_API_KEY at all (point-in-time's step above did, this one
        # didn't) -- run #3's real log showed "BLOCKED: MOBULA_API_KEY not
        # set -- cannot score any BSC entries" for the one BSC/Base labeled
        # token, even though the secret itself exists in this repo (poll-
        # fast.yml/poll-slow.yml already reference it). Just a missing env
        # line in this one workflow step, not a missing secret.
        run: timeout 900 python -u backtest_categorized.py
