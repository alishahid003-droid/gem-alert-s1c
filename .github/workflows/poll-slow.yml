name: Poll slow (Layer 8 deep-scoring, Layer 2+9 wallet activity)

on:
  workflow_dispatch: {}
  # NATIVE schedule: REMOVED Sept 29 2026, ~08:45 PM PKT (~15:45 UTC) --
  # same real bug and same fix as poll-fast.yml, worse here: live GitHub
  # API check showed 21 of the last 50 poll-slow runs were fired by this
  # native `schedule:` trigger on top of the cron-job.org "gem-alert
  # poll-slow" job already covering the same 20-minute cadence -- real
  # double-spend of the expensive per-token MadeOnSol deep-scoring calls
  # (3/token), and the concurrency-group overflow this caused was also
  # silently cancelling some real cycles outright (0 jobs ever started on
  # those runs). cron-job.org's workflow_dispatch is now the sole trigger,
  # same pattern as validate-scoring.yml. Do not re-add a `schedule:`
  # block here without also removing (or replacing) the cron-job.org job,
  # or this bug comes back.

concurrency:
  group: poll-slow
  cancel-in-progress: false

jobs:
  poll-slow:
    runs-on: ubuntu-latest
    # Same real-bug protection as poll-fast.yml (Sept 30 2026) -- capped
    # well under the 20-min cron-job.org cadence so a hung run can never
    # block more than one future cycle.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run one slow poll cycle (deep-scoring + wallet-activity checks)
        env:
          MADEONSOL_API_KEY: ${{ secrets.MADEONSOL_API_KEY }}
          FOMOAPI_API_KEY: ${{ secrets.FOMOAPI_API_KEY }}
          BIRDEYE_API_KEY: ${{ secrets.BIRDEYE_API_KEY }}
          MOBULA_API_KEY: ${{ secrets.MOBULA_API_KEY }}
          WALLET_ADDRESSES: ${{ secrets.WALLET_ADDRESSES }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          EXECUTION_ENABLED: ${{ secrets.EXECUTION_ENABLED }}
          SPRINT_MODE: ${{ secrets.SPRINT_MODE }}
          SPRINT_ONLY: "false"   # Oct 6: sprint pool AND moonshot module run side by side (two $100 campaigns)
          COMPOUND_SCALPER_ENABLED: ${{ secrets.COMPOUND_SCALPER_ENABLED }}
          COMPOUND_SEED_USD: ${{ secrets.COMPOUND_SEED_USD }}
          MOONSHOT_ENABLED: ${{ secrets.MOONSHOT_ENABLED }}
          MOONSHOT_POSITION_USD: ${{ secrets.MOONSHOT_POSITION_USD }}
          REQUIRE_CONFLUENCE: ${{ secrets.REQUIRE_CONFLUENCE }}
          TOTAL_WALLET_USD: ${{ secrets.TOTAL_WALLET_USD }}
          EXECUTION_SOLANA_PRIVATE_KEY: ${{ secrets.EXECUTION_SOLANA_PRIVATE_KEY }}
          EXECUTION_BSC_PRIVATE_KEY: ${{ secrets.EXECUTION_BSC_PRIVATE_KEY }}
          EXECUTION_RHC_PRIVATE_KEY: ${{ secrets.EXECUTION_RHC_PRIVATE_KEY }}
          RHC_RPC_URL: ${{ secrets.RHC_RPC_URL }}
        run: python scheduler.py --poll-slow
