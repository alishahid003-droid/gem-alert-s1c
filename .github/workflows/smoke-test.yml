name: Smoke test (fixtures, no keys needed)

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  fixture-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run fixture-based parse/scoring tests (no network)
        run: python scheduler.py --self-test

  live-probe:
    # This job actually reaches the internet (GitHub Actions runners are
    # unrestricted, unlike the sandbox this code was originally written in).
    # It only touches endpoints that need no key: Binance's public listing
    # feed, Coinbase's public products list, and Telegram (if the bot token
    # secret is set) -- so it gives Ali a real signal before every key from
    # Part A is even in place.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Probe no-key-required endpoints (+ Upstash if configured)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          python - <<'PY'
          import time
          from layers.layer4_news import fetch_binance_new_listings, parse_binance_new_listings, fetch_coinbase_products
          from telegram_alert import send_telegram_message
          from config import CONFIG
          import state

          bn = fetch_binance_new_listings()
          print("Binance listings fetch ok:", bn["ok"], "status:", bn["raw"]["status_code"])
          if bn["ok"]:
              print("Parsed:", parse_binance_new_listings(bn["raw"].get("json") or {}))

          cb = fetch_coinbase_products()
          print("Coinbase products fetch ok:", cb["ok"], "status:", cb["raw"]["status_code"])

          if CONFIG.telegram_ready():
              res = send_telegram_message("gem-alert-s1c smoke test: live probe reached this Telegram chat OK.")
              print("Telegram send:", res)
          else:
              print("Telegram not configured yet -- add TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID secrets to test this.")

          print("State backend:", state.backend())
          if state.backend() == "upstash":
              probe_key = "smoke_test_probe"
              state.set_value(probe_key, {"probed_at": time.time()})
              readback = state.get_value(probe_key)
              print("Upstash roundtrip ok:", readback is not None, "value:", readback)
          else:
              print("Upstash not configured yet -- add UPSTASH_REDIS_REST_URL / UPSTASH_REDIS_REST_TOKEN secrets to test this.")

          # Free-RPC-pool health check, ALL THREE chains (Ali, Sept 23 2026:
          # "point 6 should cover all 3 chains" -- wants every no-signup RPC
          # endpoint proven reliable, not assumed). ONE lightweight call per
          # endpoint -- getHealth for Solana (its native health-check
          # method), eth_blockNumber for the two EVM-style chains (BSC,
          # Robinhood Chain -- they don't implement getHealth) -- run only
          # when this workflow fires, not on any tight loop, so this never
          # itself becomes what drains a free tier.
          import executor.rpc_pool as rpc_pool
          from utils.http import post_json

          HEALTH_METHOD_BY_CHAIN = {
              "solana": "getHealth",
              "bsc": "eth_blockNumber",
              "robinhood_chain": "eth_blockNumber",
          }

          print("\n--- RPC pool health check, all 3 chains (1 call per endpoint) ---")
          total_healthy = 0
          total_endpoints = 0
          for chain, pool in rpc_pool.RPC_ENDPOINT_POOLS.items():
              method = HEALTH_METHOD_BY_CHAIN.get(chain, "eth_blockNumber")
              print(f"\n[{chain}] ({len(pool)} endpoint(s), method={method})")
              chain_healthy = 0
              for url in pool:
                  t0 = time.time()
                  resp = post_json(url, json={"jsonrpc": "2.0", "id": 1, "method": method, "params": []}, timeout=10)
                  dt = time.time() - t0
                  body = resp.get("json") or {}
                  ok = bool(resp.get("ok")) and "result" in body and "error" not in body
                  chain_healthy += 1 if ok else 0
                  print(f"  {'OK  ' if ok else 'FAIL'} {url}  status={resp.get('status_code')} latency={dt*1000:.0f}ms")
              total_healthy += chain_healthy
              total_endpoints += len(pool)
              print(f"  {chain_healthy}/{len(pool)} {chain} endpoints healthy this run")
              if chain_healthy == 0:
                  print(f"  WARNING: entire {chain} RPC pool unreachable from this runner -- investigate before enabling execution on {chain}.")

          print(f"\n{total_healthy}/{total_endpoints} total RPC endpoints healthy across all 3 chains this run")
          PY
