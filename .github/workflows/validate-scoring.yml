name: Validate scoring (Section 1 -- point-in-time + categorized backtests)

on:
  workflow_dispatch: {}
  # TEMPORARY, Sept 29 2026 -- cron doesn't support "run once", so this is a
  # one-shot alarm timed for just after MadeOnSol's daily budget resets
  # (00:00 UTC), so this run gets a real, clean, budget-fresh read with
  # zero manual clicking (no GitHub write token available from either the
  # Cowork cloud sandbox or Ali's own device shell -- both are proxied and
  # can't reach madeonsol.com directly or call the Actions API, confirmed
  # live tonight -- same restriction the README already documents for
  # every other data source in this project). REMOVE this schedule block
  # after tonight's run completes, or it'll keep firing daily at 00:07 UTC
  # and burning budget every day going forward.
  schedule:
    - cron: "7 0 * * *"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Point-in-time credibility backtest
        env:
          MADEONSOL_API_KEY: ${{ secrets.MADEONSOL_API_KEY }}
          BIRDEYE_API_KEY: ${{ secrets.BIRDEYE_API_KEY }}
          PYTHONUNBUFFERED: "1"
        # PYTHONUNBUFFERED + python -u: without this, Python block-buffers
        # stdout when it isn't a real terminal (exactly the case here, piped
        # into GitHub's log capture) -- prints can sit invisible for many
        # minutes even while the script is actively working. `timeout` is a
        # hard ceiling so a slow/rate-limited API call fails loudly instead
        # of silently eating the whole job.
        run: timeout 900 python -u backtest_point_in_time.py --skip-onchain
      - name: Categorized credibility / sniper-accuracy backtest
        env:
          MADEONSOL_API_KEY: ${{ secrets.MADEONSOL_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: timeout 900 python -u backtest_categorized.py
