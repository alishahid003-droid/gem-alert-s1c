name: Live diagnostic (read-only)

# Read-only health check against the REAL Secrets and live Upstash state:
# key presence (never values), runner heartbeats, fomoapi.io roster
# matching, and per-alert auto-buy verdicts. Writes nothing, spends no
# MadeOnSol budget. Runs on demand, and automatically when diag_live.py
# itself changes on a claude/ working branch.
on:
  workflow_dispatch: {}
  push:
    branches: ["claude/**"]
    paths: ["diag_live.py", ".github/workflows/diag-live.yml"]

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run live diagnostic
        env:
          PYTHONUNBUFFERED: "1"
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          MADEONSOL_API_KEY: ${{ secrets.MADEONSOL_API_KEY }}
          MOBULA_API_KEY: ${{ secrets.MOBULA_API_KEY }}
          FOMOAPI_API_KEY: ${{ secrets.FOMOAPI_API_KEY }}
          BIRDEYE_API_KEY: ${{ secrets.BIRDEYE_API_KEY }}
          GOPLUS_API_KEY: ${{ secrets.GOPLUS_API_KEY }}
          ADANOS_API_KEY: ${{ secrets.ADANOS_API_KEY }}
          CRYPTOPANIC_AUTH_TOKEN: ${{ secrets.CRYPTOPANIC_AUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CALLER_BOT_TOKEN: ${{ secrets.TELEGRAM_CALLER_BOT_TOKEN }}
          TELEGRAM_CALLER_CHANNEL_IDS: ${{ secrets.TELEGRAM_CALLER_CHANNEL_IDS }}
          WALLET_ADDRESSES: ${{ secrets.WALLET_ADDRESSES }}
          EXECUTION_ENABLED: ${{ secrets.EXECUTION_ENABLED }}
          EXECUTION_SOLANA_PRIVATE_KEY: ${{ secrets.EXECUTION_SOLANA_PRIVATE_KEY }}
          EXECUTION_BSC_PRIVATE_KEY: ${{ secrets.EXECUTION_BSC_PRIVATE_KEY }}
          EXECUTION_RHC_PRIVATE_KEY: ${{ secrets.EXECUTION_RHC_PRIVATE_KEY }}
          RHC_RPC_URL: ${{ secrets.RHC_RPC_URL }}
          TOTAL_WALLET_USD: ${{ secrets.TOTAL_WALLET_USD }}
        run: python diag_live.py
