name: Poll fast (discovery -- Layer 1, Layer 0b, Layer 4, Layer 6)

on:
  workflow_dispatch: {}
  # NATIVE schedule: REMOVED Sept 29 2026, ~08:45 PM PKT (~15:45 UTC) --
  # real bug found and fixed during a pre-flight check ahead of tomorrow's
  # validate-scoring run. This native GitHub `schedule:` trigger was
  # re-enabled earlier the same day (see git history) *alongside* the
  # cron-job.org "gem-alert poll-fast" job that already covers this exact
  # 10-minute cadence -- the whole reason cron-job.org exists is that
  # GitHub's native schedule trigger is unreliable, not a second cadence
  # to run in parallel with it. Live evidence pulled from the GitHub API:
  # of the last 50 poll-fast runs, 1 was schedule-triggered on top of the
  # cron-job.org dispatches, and most runs were coming back CANCELLED with
  # zero jobs ever started -- the concurrency group (one running + one
  # queued max) was overflowing from the two triggers competing, silently
  # dropping some real discovery cycles. cron-job.org's workflow_dispatch
  # is now the sole trigger, same pattern as validate-scoring.yml. Do not
  # re-add a `schedule:` block here without also removing (or replacing)
  # the cron-job.org job, or this bug comes back.

concurrency:
  group: poll-fast
  cancel-in-progress: false

jobs:
  poll-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run one fast poll cycle (discovery only)
        env:
          MADEONSOL_API_KEY: ${{ secrets.MADEONSOL_API_KEY }}
          MOBULA_API_KEY: ${{ secrets.MOBULA_API_KEY }}
          CRYPTOPANIC_AUTH_TOKEN: ${{ secrets.CRYPTOPANIC_AUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WALLET_ADDRESSES: ${{ secrets.WALLET_ADDRESSES }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          EXECUTION_ENABLED: ${{ secrets.EXECUTION_ENABLED }}
          EXECUTION_SOLANA_PRIVATE_KEY: ${{ secrets.EXECUTION_SOLANA_PRIVATE_KEY }}
          EXECUTION_BSC_PRIVATE_KEY: ${{ secrets.EXECUTION_BSC_PRIVATE_KEY }}
          EXECUTION_RHC_PRIVATE_KEY: ${{ secrets.EXECUTION_RHC_PRIVATE_KEY }}
          RHC_RPC_URL: ${{ secrets.RHC_RPC_URL }}
        run: python scheduler.py --poll-fast
