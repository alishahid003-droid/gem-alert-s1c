name: Layer 0/0b rug-scoring backtest

on:
  workflow_dispatch:
    inputs:
      sample_size:
        description: "Tokens per tier (default 20)"
        required: false
        default: "20"

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run backtest
        env:
          MADEONSOL_API_KEY: ${{ secrets.MADEONSOL_API_KEY }}
        run: python backtest.py --sample-size "${{ github.event.inputs.sample_size }}"
