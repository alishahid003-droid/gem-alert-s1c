name: Poll fast (discovery -- Layer 1, Layer 0b, Layer 4, Layer 6)

on:
  workflow_dispatch: {}
  schedule:
    # Every 10 minutes, UNCHANGED. This is the discovery cadence -- Layer 1
    # (deployer alerts) and Layer 0b (Mobula Pulse scoring) finding
    # brand-new tokens. Deliberately left fast per Ali's explicit direction:
    # entry-timing speed is the single most valuable signal in this whole
    # system, and this cycle is cheap (one batched call per source, no
    # per-token MadeOnSol scoring) -- see README's call-budget section.
    #
    # HONEST NUMBER: even on its own, Layer 1's 2 MadeOnSol calls/cycle at
    # this cadence is ~288 calls/day -- already over the stated 200/day cap,
    # independent of anything in poll-slow.yml. Splitting the expensive
    # pieces into their own slower cycle (see poll-slow.yml) doesn't fix
    # this on its own, because Layer 1 itself isn't one of the pieces this
    # split slows down (on purpose). See README for the options.
    - cron: "*/10 * * * *"

jobs:
  poll-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run one fast poll cycle (discovery only)
        env:
          MADEONSOL_API_KEY: ${{ secrets.MADEONSOL_API_KEY }}
          MOBULA_API_KEY: ${{ secrets.MOBULA_API_KEY }}
          CRYPTOPANIC_AUTH_TOKEN: ${{ secrets.CRYPTOPANIC_AUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WALLET_ADDRESSES: ${{ secrets.WALLET_ADDRESSES }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          EXECUTION_ENABLED: ${{ secrets.EXECUTION_ENABLED }}
          EXECUTION_SOLANA_PRIVATE_KEY: ${{ secrets.EXECUTION_SOLANA_PRIVATE_KEY }}
          EXECUTION_BSC_PRIVATE_KEY: ${{ secrets.EXECUTION_BSC_PRIVATE_KEY }}
          EXECUTION_RHC_PRIVATE_KEY: ${{ secrets.EXECUTION_RHC_PRIVATE_KEY }}
          RHC_RPC_URL: ${{ secrets.RHC_RPC_URL }}
        run: python scheduler.py --poll-fast
