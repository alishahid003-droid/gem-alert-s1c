name: Poll slow (Layer 8 deep-scoring, Layer 2+9 wallet activity)

on:
  workflow_dispatch: {}
  schedule:
    # Every 20 minutes -- the expensive pieces (Layer 8's per-token MadeOnSol
    # deep scoring, 3 calls/token, plus Layers 2+9's KOL-feed/wallet-balance
    # checks). Per Ali's direction: 15-20 min is enough here (it's not the
    # discovery step, so a few extra minutes of latency on a convergence/
    # sell-mirror/re-score check doesn't cost the thing that actually
    # matters -- entry timing, which stays on poll-fast.yml's 10-min cycle).
    # Set to 20 rather than 15 as the safer default under MadeOnSol's stated
    # 200/day cap -- see README's call-budget table for the 15 vs 20 numbers
    # and change this to */15 if you'd rather trade some safety margin for
    # a bit more freshness once you've confirmed the real cap.
    - cron: "*/20 * * * *"

jobs:
  poll-slow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run one slow poll cycle (deep-scoring + wallet-activity checks)
        env:
          MADEONSOL_API_KEY: ${{ secrets.MADEONSOL_API_KEY }}
          MOBULA_API_KEY: ${{ secrets.MOBULA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: python scheduler.py --poll-slow
